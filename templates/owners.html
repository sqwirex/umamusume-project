{% extends "base.html" %}
{% block title %}Владельцы · Умамусуме{% endblock %}
{% block content %}
<div class="page-head">
    <div>
        <span class="eyebrow">Справочник</span>
        <h1>Владельцы</h1>
    </div>
</div>
<div class="grid">
    <section class="panel">
        <h2>Добавить владельца</h2>
        <form method="post" class="form">
            <label>Имя<input name="name" required></label>
            <label>Адрес<input name="address" required></label>
            <label>Телефон<input name="phone" required></label>
            <button class="button" type="submit">Добавить</button>
        </form>
    </section>
    <section class="panel wide">
        <h2>Список владельцев</h2>
        <div class="table-wrap">
            <table>
                <thead><tr><th>Имя</th><th>Адрес</th><th>Телефон</th></tr></thead>
                <tbody>
                    {% for item in owners %}
                    <tr><td>{{ item.name }}</td><td>{{ item.address }}</td><td>{{ item.phone }}</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </section>
</div>
{% endblock %}
